  const map={};gs.forEach(g=>{if(!g||!g.name)return;let x=D.groups.find(y=>y.name===g.name);if(!x){x={id:'g'+D.seq++,name:String(g.name),enabled:g.enabled!==false};D.groups.push(x)}map[g.id]=x.id});
  const seen=new Set(D.cards.map(c=>c.type+'|'+c.group+'|'+c.content));let n=0;
  cs.forEach(c=>{if(!c||c.content==null||c.content==='')return;const s=String(c.content),ty=c.type==='image'||/^data:image/.test(s)?'image':(c.type==='text'||c.type==='emoji'||c.type==null)?(EMO.test(s)?'emoji':'text'):null;if(!ty)return;const gid=map[c.group]||(D.groups.some(g=>g.id===c.group)?c.group:'public'),k=ty+'|'+gid+'|'+s;if(seen.has(k))return;seen.add(k);D.cards.push({id:D.seq++,type:ty,content:s,group:gid,enabled:c.enabled!==false});n++});
  save();drawLib();toast('导入 '+n+' 张字卡')}catch(e){toast('文件格式不对')}};rd.readAsText(f)};fi.click()}

/* 转账 */
function resolveXf(m){setTimeout(()=>{if(m.pay.st!=='wait')return;const acc=Math.max(0,Math.min(100,Number(D.cfg.xferAcc==null?85:D.cfg.xferAcc)));const back=Math.max(0,Math.min(100,Number(D.cfg.xferBack==null?15:D.cfg.xferBack)));const accepted=Math.random()*100<acc;const returned=Math.random()*100<back;if(returned){m.pay.st='back';m.pay.t1=Date.now();push('t','sys','对方已退还你的转账')}else if(accepted){m.pay.st='ok';m.pay.t1=Date.now();push('t','sys','对方已收款 ¥'+m.pay.amt.toFixed(2))}else{resolveXf(m)}},rnd(3000,9000))}
$('pXf').onclick=()=>{panel(null);openXi()};
/* 长按消息菜单 */
$('qx').onclick=()=>setQuote(null);
const MI=d=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+d+'</svg>';
const MIC={'引用':MI('<path d="M5 6h14a1.5 1.5 0 0 1 1.5 1.5v8A1.5 1.5 0 0 1 19 17h-8l-4.5 3.5V17H5a1.5 1.5 0 0 1-1.5-1.5v-8A1.5 1.5 0 0 1 5 6z"/><path d="M8.5 10.5h7M8.5 13.5h4"/>'),'修改':MI('<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="m13.5 6.5 4 4"/>'),'复制':MI('<rect x="8.5" y="8.5" width="11" height="11" rx="2.2"/><path d="M15.5 8.5V6.7a2.2 2.2 0 0 0-2.2-2.2H6.7a2.2 2.2 0 0 0-2.2 2.2v6.6a2.2 2.2 0 0 0 2.2 2.2h1.8"/>'),'删除':MI('<path d="M4.5 7h15M9.5 7V4.8h5V7M6.5 7l.8 12.2h9.4L17.5 7M10 11v5M14 11v5"/>')};
function msgMenu(m,r){
  const mine=m.w==='m',acts=[];
  if(['txt','stk','img'].includes(m.type))acts.push(['引用',()=>setQuote([mine?D.S.myName:D.S.name,briefOf(m)])]);
  if(m.type==='txt')acts.push(['复制',()=>{(navigator.clipboard?navigator.clipboard.writeText(m.x):Promise.reject()).then(()=>toast('已复制'),()=>toast('复制失败'))}]);
  if(mine&&m.type==='txt')acts.push(['修改',()=>{const t=h('textarea');t.value=m.x;t.rows=4;dlg('修改消息',t,'保存',()=>{const v=t.value.trim();if(!v){toast('内容不能为空');return false}m.x=v;save();render(false);toast('已修改')});setTimeout(()=>t.focus(),60)}]);
  acts.push(['删除',()=>conf('删除这条消息？',()=>{const i=D.msgs.indexOf(m);if(i>=0)D.msgs.splice(i,1);save();render(false);toast('已删除')},'删除')]);
  const mm=$('mm'),c=$('mmc');c.innerHTML='';c.className='';
  acts.forEach(([t,fn])=>{const x=h('button');x.innerHTML=(MIC[t]||'')+'<span>'+t+'</span>';x.onclick=()=>{mm.classList.remove('on');setTimeout(fn,40)};c.append(x)});
  c.style.left='0px';c.style.top='0px';mm.classList.add('on');
  const tg=r.querySelector('.bb,.stk,.pic,.xf')||r,rc=tg.getBoundingClientRect(),cr=c.getBoundingClientRect(),W=innerWidth,H=innerHeight,cx=rc.left+rc.width/2,left=Math.min(Math.max(8,cx-cr.width/2),W-cr.width-8),up=rc.top-cr.height-12>80;
  let top=up?rc.top-cr.height-10:Math.min(rc.bottom+10,H-cr.height-12);if(!up&&rc.bottom+cr.height+12>H)top=Math.max(90,Math.min(rc.top+8,H-cr.height-12));
  c.style.left=left+'px';c.style.top=top+'px';c.className=up?'up':'dn';c.style.setProperty('--ax',Math.min(Math.max(18,cx-left),cr.width-18)+'px')}
$('mm').addEventListener('click',e=>{if(e.target===$('mm'))$('mm').classList.remove('on')});
(function(){const L=$('list');let tm=null,x0=0,y0=0,fired=false;const clr=()=>{clearTimeout(tm);tm=null};
  const open=r=>{const m=D.msgs[+r.dataset.i];if(m){fired=true;clr();if(navigator.vibrate)navigator.vibrate(15);msgMenu(m,r)}};
  L.addEventListener('pointerdown',e=>{const r=e.target.closest('.r[data-i]');if(!r)return;fired=false;x0=e.clientX;y0=e.clientY;clr();tm=setTimeout(()=>open(r),400)});
  L.addEventListener('pointermove',e=>{if(tm&&(Math.abs(e.clientX-x0)>10||Math.abs(e.clientY-y0)>10))clr()});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>L.addEventListener(ev,clr));
  L.addEventListener('scroll',()=>{clr();$('mm').classList.remove('on')},{passive:true});
  L.addEventListener('contextmenu',e=>{e.preventDefault();const r=e.target.closest('.r[data-i]');if(r&&!fired)open(r)});
  document.addEventListener('click',e=>{if(fired){fired=false;e.stopPropagation();e.preventDefault()}},true)})();
(async()=>{D=(await dbGet())||def();D.cfg={...def().cfg,...D.cfg};render();D.msgs.filter(m=>m.type==='pay'&&m.w==='m'&&m.pay.st==='wait').forEach(resolveXf)})();
</script></body></html>
