<style>
:root{--bg:#ededed;--bar:#f7f7f7;--ln:#dcdcdc;--ink:#191919;--sub:#8a8a8a;--ta:#fff;--me:#b9e3ab;--send:#7fc88a;--card:#fff;--red:#e5484d}
@media(prefers-color-scheme:dark){:root{--bg:#111;--bar:#1b1b1b;--ln:#2e2e2e;--ink:#e6e6e6;--sub:#8c8c8c;--ta:#2b2b2b;--me:#4a7a47;--send:#4f9a5a;--card:#1e1e1e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0}
#app{height:100dvh;display:flex;flex-direction:column}
.hd,.ph{flex:none;height:calc(48px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);display:flex;align-items:center;justify-content:center;position:relative;background:var(--bg);font-weight:600;font-size:17px;border-bottom:.5px solid var(--ln)}
.hd .mr,.ph .ac{position:absolute;right:6px;bottom:0;height:48px;padding:0 12px;display:flex;align-items:center}.ph .bk{position:absolute;left:4px;bottom:0;height:48px;padding:0 12px;font-size:26px}
#list{flex:1;overflow-y:auto;background-size:cover;background-position:center;padding-bottom:10px}
.tm{text-align:center;color:var(--sub);font-size:12px;margin:14px 0 4px}
.r{display:flex;gap:10px;margin:12px 12px;align-items:flex-start}.r.me{flex-direction:row-reverse}
.av{flex:none;width:40px;height:40px;border-radius:6px;background:#bcbcbc center/cover;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center}
.bb{position:relative;max-width:68%;padding:9px 12px;border-radius:6px;white-space:pre-wrap;word-break:break-word;line-height:1.45}
.ta .bb{background:var(--ta)}.me .bb{background:var(--me)}
.bb::before{content:"";position:absolute;top:13px;border:6px solid transparent}
.ta .bb::before{left:-10px;border-right-color:var(--ta)}.me .bb::before{right:-10px;border-left-color:var(--me)}
.col{display:flex;flex-direction:column;gap:4px;max-width:68%}.me .col{align-items:flex-end}.ta .col{align-items:flex-start}.col .bb{max-width:100%}
.qt{font-size:12.5px;color:var(--sub);background:rgba(120,120,128,.15);border-radius:5px;padding:5px 8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#qbar{flex:none;display:none;align-items:center;gap:10px;padding:7px 8px 7px 14px;background:var(--bar);border-top:.5px solid var(--ln);font-size:13px}#qbar.on{display:flex}#qbar div{flex:1;min-width:0}#qbar b{display:block;font-weight:600;opacity:.7}#qbar span{display:block;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#qbar button{font-size:22px;padding:2px 10px;opacity:.6}

  c.style.left=left+'px';c.style.top=top+'px';c.className=up?'up':'dn';c.style.setProperty('--ax',Math.min(Math.max(18,cx-left),cr.width-18)+'px')}

  L.addEventListener('pointermove',e=>{if(tm&&(Math.abs(e.clientX-x0)>10||Math.abs(e.clientY-y0)>10))clr()});
